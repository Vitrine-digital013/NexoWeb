<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexo Web - Painel Administrativo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 22px;
    }

    header span {
      color: #9ca3af;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .card h3 {
      color: #6b7280;
      font-size: 15px;
      margin-bottom: 10px;
    }

    .card strong {
      font-size: 30px;
    }

    .panel {
      background: white;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .panel h2 {
      margin-bottom: 20px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 7px;
    }

    button {
      background: #111827;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 7px;
      cursor: pointer;
    }

    button:hover {
      opacity: .85;
    }

    .client {
      padding: 15px;
      border: 1px solid #eee;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .delete {
      background: #dc2626;
    }

    .logout {
      background: #dc2626;
    }
  </style>
</head>

<body>

<header>
  <div>
    <h1>Nexo Web</h1>
    <span>Painel Administrativo</span>
  </div>

  <button class="logout" onclick="logout()">Sair</button>
</header>

<div class="container">

  <div class="cards">
    <div class="card">
      <h3>Clientes</h3>
      <strong id="totalClientes">0</strong>
    </div>

    <div class="card">
      <h3>Serviços</h3>
      <strong id="totalServicos">0</strong>
    </div>

    <div class="card">
      <h3>Solicitações</h3>
      <strong id="totalSolicitacoes">0</strong>
    </div>
  </div>

  <div class="panel">
    <h2>Adicionar cliente</h2>

    <input id="nomeCliente" type="text" placeholder="Nome do cliente">
    <input id="empresaCliente" type="text" placeholder="Nome da empresa">
    <input id="telefoneCliente" type="text" placeholder="WhatsApp">

    <button onclick="adicionarCliente()">Adicionar cliente</button>
  </div>

  <div class="panel">
    <h2>Clientes cadastrados</h2>
    <div id="listaClientes"></div>
  </div>

  <div class="panel">
    <h2>Configurações</h2>

    <input id="nomeEmpresa" type="text" placeholder="Nome da empresa">

    <button onclick="salvarConfiguracoes()">
      Salvar configurações
    </button>
  </div>

</div>

<script>

let clientes = JSON.parse(localStorage.getItem("nexo_clientes")) || [];

function atualizarPainel() {

  document.getElementById("totalClientes").textContent =
    clientes.length;

  document.getElementById("totalServicos").textContent =
    localStorage.getItem("nexo_servicos") || 0;

  document.getElementById("totalSolicitacoes").textContent =
    localStorage.getItem("nexo_solicitacoes") || 0;

  const lista = document.getElementById("listaClientes");

  lista.innerHTML = "";

  if (clientes.length === 0) {
    lista.innerHTML = "<p>Nenhum cliente cadastrado.</p>";
    return;
  }

  clientes.forEach((cliente, index) => {

    lista.innerHTML += `
      <div class="client">
        <div>
          <strong>${cliente.nome}</strong><br>
          ${cliente.empresa}<br>
          ${cliente.telefone}
        </div>

        <button class="delete"
          onclick="removerCliente(${index})">
          Excluir
        </button>
      </div>
    `;

  });
}

function adicionarCliente() {

  const nome = document.getElementById("nomeCliente").value;
  const empresa = document.getElementById("empresaCliente").value;
  const telefone = document.getElementById("telefoneCliente").value;

  if (!nome || !empresa) {
    alert("Preencha o nome e a empresa.");
    return;
  }

  clientes.push({
    nome: nome,
    empresa: empresa,
    telefone: telefone
  });

  localStorage.setItem(
    "nexo_clientes",
    JSON.stringify(clientes)
  );

  document.getElementById("nomeCliente").value = "";
  document.getElementById("empresaCliente").value = "";
  document.getElementById("telefoneCliente").value = "";

  atualizarPainel();
}

function removerCliente(index) {

  clientes.splice(index, 1);

  localStorage.setItem(
    "nexo_clientes",
    JSON.stringify(clientes)
  );

  atualizarPainel();
}

function salvarConfiguracoes() {

  const nome = document.getElementById("nomeEmpresa").value;

  localStorage.setItem(
    "nexo_empresa",
    nome
  );

  alert("Configurações salvas!");
}

function logout() {
  window.location.href = "../index.html";
}

atualizarPainel();

</script>

</body>
</html>
